name: Release - manual

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        type: choice
        options:
          - x
          - instagram
        required: true
      version_input:
        description: "App version (e.g. 12.2.0-release.0 or 435.0.0.37.76)"
        required: true
      force:
        description: "Rebuild even if versions are unchanged"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: piko-release-${{ github.event.inputs.app }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore signing keystore
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD != '' && secrets.APK_KEYSTORE_PASSWORD || '123456789' }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS != '' && secrets.APK_KEY_ALIAS || 'jhc' }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD != '' && secrets.APK_KEY_PASSWORD || '123456789' }}
        run: |
          mkdir -p signing
          if [ -n "${APK_KEYSTORE_BASE64:-}" ]; then
            : "${APK_KEYSTORE_PASSWORD:?Missing APK_KEYSTORE_PASSWORD secret}"
            : "${APK_KEY_ALIAS:?Missing APK_KEY_ALIAS secret}"
            : "${APK_KEY_PASSWORD:?Missing APK_KEY_PASSWORD secret}"
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          else
            echo "No APK_KEYSTORE_BASE64 secret; using committed ks.keystore (stock defaults)"
            cp ks.keystore signing/release.keystore
            echo "APK_KEYSTORE_PASSWORD=123456789" >> "$GITHUB_ENV"
            echo "APK_KEY_ALIAS=jhc" >> "$GITHUB_ENV"
            echo "APK_KEY_PASSWORD=123456789" >> "$GITHUB_ENV"
          fi

      - name: Build and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FORCE_BUILD: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          APK_KEYSTORE_PATH: signing/release.keystore
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD != '' && secrets.APK_KEYSTORE_PASSWORD || '123456789' }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS != '' && secrets.APK_KEY_ALIAS || 'jhc' }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD != '' && secrets.APK_KEY_PASSWORD || '123456789' }}
        run: |
          mkdir -p bins
          uv run main.py --app ${{ github.event.inputs.app }} --m 1 --v ${{ github.event.inputs.version_input }}
